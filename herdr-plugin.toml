# herdr plugin: PC RAM & CPU Usage Overlay (CPU / RAM per space)
#
# Shows CPU and RAM usage per space (workspace), grouped under each space's
# git branch name. herdr plugin v1 has no API to draw into the sidebar, so the
# data is surfaced two ways:
#   - a live terminal pane  ("Space usage" overlay)
#   - a one-shot action     ("Space usage report")
#
# Install:     herdr plugin install ezcorp-org/herdr-pc-ram-and-cpu-usage-overlay
# Local dev:   herdr plugin link /path/to/herdr-pc-ram-and-cpu-usage-overlay   (references the dir in place)
# Remove:      herdr plugin unlink ez-corp.space-usage
# Logs:        herdr plugin log list --plugin ez-corp.space-usage

id = "ez-corp.space-usage"
name = "PC RAM & CPU Usage Overlay"
version = "1.6.0"
# Oldest herdr with every API this plugin calls: `session.snapshot`, the `tokens`
# metadata API on `pane.report_metadata` / `workspace.report_metadata`, and
# `pane.process_info` — all 0.7.5. Diffing the two bundled API schemas
# (`herdr api schema`, protocol 17 → 19) shows 0.8.0 changed none of the types
# used here, so this stays put; developed and tested against 0.8.0.
min_herdr_version = "0.7.5"
description = "CPU and RAM usage per space, grouped under the branch name."
platforms = ["linux", "macos", "windows"]

# Commands are argv arrays (no shell) and run with the plugin dir as cwd,
# per https://herdr.dev/docs/plugins/#trust-and-security

# Compiled at install time: herdr runs this once with the plugin root as cwd.
# The resulting ./target/release/space-usage rides into HERDR_PLUGIN_ROOT and is
# what every pane/action command below invokes (relative to the plugin root).
[[build]]
command = ["cargo", "build", "--release"]
platforms = ["linux", "macos", "windows"]

# Restart recovery. herdr runs startup hooks on both a fresh server start and a
# live handoff (`herdr update --handoff`), so this fires whenever herdr comes
# back. `--restore` re-spawns the updater ONLY if it was enabled when herdr went
# away (it reads a marker written by --enable / removed by --disable), and is a
# silent no-op otherwise — so a deliberate --disable stays disabled, and an
# already-live daemon is left alone. Without this the updater dies with herdr and
# the sidebar stays blank until someone re-invokes status-enable by hand.
[[startup]]
command = ["./target/release/space-usage", "--restore"]
platforms = ["linux", "macos", "windows"]

# Live, self-refreshing dashboard. Opened as a temporary zoomed overlay pane.
[[panes]]
id = "dashboard"
title = "Space usage"
placement = "overlay"
command = ["./target/release/space-usage", "--interval", "2"]

# One-shot snapshot printed to stdout / plugin log.
[[actions]]
id = "report"
title = "Space usage report"
contexts = ["workspace"]
command = ["./target/release/space-usage", "--once"]

# Draws the cpu/ram/battery row in all four icon tiers so the user can pick one
# by eye. Whether a Nerd Font is installed, and whether the terminal draws emoji
# at one column or two, is visible only to the person looking at the screen —
# so the plugin shows the options rather than guessing. Needs no herdr
# connection, so it still works with the server down.
[[actions]]
id = "icons"
title = "Preview icon tiers"
command = ["./target/release/space-usage", "--icons"]

# Sidebar status updater: a background daemon that pushes each space's usage
# as display-only metadata on a spare shell pane; the locally patched herdr
# renders it as a third row in the sidebar spaces card. Statuses carry a TTL,
# so the text self-clears if the daemon dies.
[[actions]]
id = "status-toggle"
title = "Toggle sidebar usage status"
command = ["./target/release/space-usage", "--toggle"]

[[actions]]
id = "status-enable"
title = "Enable sidebar usage status"
command = ["./target/release/space-usage", "--enable"]

[[actions]]
id = "status-disable"
title = "Disable sidebar usage status"
command = ["./target/release/space-usage", "--disable"]
